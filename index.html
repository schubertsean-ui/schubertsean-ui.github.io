<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scroll or Search until something finds you.</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#eadcc6; --gold:#c4a574; --muted:#9a8b76; --ink:#1a1410; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #120c09; color: var(--paper); font-family: "Cormorant Garamond", Georgia, serif; }
    header { padding: 1.1rem 1rem .7rem; position: sticky; top: 0; z-index: 5; background: #120c09f2; }
    .eyebrow { margin: 0 0 .3rem; font-family: "IBM Plex Mono", monospace; font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
    .lede { margin: 0 0 .7rem; font-weight: 500; font-style: italic; font-size: 1.12rem; }
    #q { width: 100%; background: #0003; border: 1px solid #c4a57444; color: var(--paper); padding: .65rem .75rem; font: 400 1rem "Cormorant Garamond", serif; }
    .chips { display: flex; gap: .35rem; margin-top: .55rem; }
    .chips button { font-family: "IBM Plex Mono", monospace; font-size: .55rem; letter-spacing: .08em; text-transform: uppercase; background: transparent; color: var(--muted); border: 1px solid #c4a57433; padding: .35rem .5rem; }
    .chips button.on { color: var(--paper); border-color: var(--gold); }
    .crate { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; padding: 12px 12px 80px; background: linear-gradient(#3a2a1c,#1a120c); }
    @media (min-width: 720px) { .crate { grid-template-columns: 1fr 1fr 1fr 1fr; } }
    article { background: none; border: 0; color: inherit; text-align: left; padding: 0; width: 100%; cursor: pointer; font: inherit; }
    .art { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #1b140f; box-shadow: 6px 12px 22px #0007; }
    article h2 { margin: .4rem 0 0; font-size: .95rem; font-weight: 500; font-style: italic; }
    article .meta { margin: .1rem 0 0; font-family: "IBM Plex Mono", monospace; font-size: .5rem; color: var(--muted); }
    .stage { position: fixed; inset: 0; background: #0a0705f5; overflow: auto; padding: .8rem; z-index: 20; }
    .stage[hidden] { display: none; }
    .ghost { font-family: "IBM Plex Mono", monospace; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; background: none; color: var(--gold); border: 1px solid #c4a57455; padding: .4rem .55rem; }
    .faces img { width: min(88vw,440px); display: block; margin: .6rem auto; background: #111; }
    .card { background: #f3ead8; color: var(--ink); max-width: 520px; margin: .8rem auto 2rem; padding: 1.1rem; }
    .listen a { display: block; text-align: center; text-decoration: none; font-family: "IBM Plex Mono", monospace; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: .7rem; margin-top: .35rem; }
    .sp { background: #1db954; color: #062; }
    .ap { background: #111; color: #fff; }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow" id="count">Start anywhere</p>
    <p class="lede">Scroll or Search until something finds you.</p>
    <input id="q" type="search" placeholder="Artist, title, label, year…" />
    <div class="chips" id="chips"></div>
  </header>
  <div class="crate" id="bin"></div>
  <div class="stage" id="stage" hidden>
    <button class="ghost" id="close">Put it back</button>
    <div class="faces" id="faces"></div>
    <div class="card" id="card"></div>
  </div>
  <script src="photos.js"></script>
  <script src="list.js"></script>
  <script>
    function readable(s) {
      s = String(s || "").trim();
      if (!s) return "";
      const letters = (s.match(/[A-Za-z]/g) || []).length;
      const words = s.match(/[A-Za-z']+/g) || [];
      const short = words.filter(w => w.length <= 2).length;
      if (letters < 6) return "";
      if (words.length && short / words.length > 0.5) return "";
      if (/IMG_|ee 4|se ey|epee|Mites |Abd\.|Srey |prAT |geese MILES|CHARLER|tena$/i.test(s)) return "";
      return s;
    }
    const ALL = (window.PHOTOS || []).concat(window.LIST || []).map(a => {
      const title = readable(a.title) || readable(a.raw) || "";
      const artist = readable(a.artist);
      if (!title && !artist) return null;
      return Object.assign({}, a, { title: title || artist, artist: artist || "" });
    }).filter(Boolean);
    const bin = document.getElementById("bin");
    const q = document.getElementById("q");
    const chips = document.getElementById("chips");
    const count = document.getElementById("count");
    const stage = document.getElementById("stage");
    let crate = "all";
    function keyOf(a) { return ((a.artist || a.title || "") + " " + (a.title || "")).toLowerCase(); }
    function hay(a) { return [a.artist, a.title, a.label, a.catalog, a.year].filter(Boolean).join(" ").toLowerCase(); }
    function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&", "<": "<", ">": ">", '"': """ }[c])); }
    function qf(a) { return encodeURIComponent([a.artist, a.title].filter(Boolean).join(" ")); }
    function draw() {
      chips.innerHTML = "";
      [["all", "All"], ["photo", "Jackets"]].forEach(([id, label]) => {
        const b = document.createElement("button");
        b.textContent = label; b.className = crate === id ? "on" : "";
        b.onclick = () => { crate = id; draw(); }; chips.appendChild(b);
      });
      const t = q.value.trim().toLowerCase();
      const rows = ALL.filter(a => {
        if (crate === "photo" && !a.front) return false;
        if (!t) return true;
        return t.split(/\s+/).every(w => hay(a).includes(w));
      }).sort((x, y) => keyOf(x).localeCompare(keyOf(y)));
      count.textContent = rows.length + " in the crate";
      bin.innerHTML = "";
      rows.forEach(a => {
        const el = document.createElement("article");
        el.innerHTML = (a.front ? `<img class="art" src="${esc(a.front)}" alt="" loading="lazy">` : "") +
          `<h2>${esc(a.artist || a.title)}</h2><p class="meta">${esc([a.artist && a.title !== a.artist ? a.title : "", a.year, a.label].filter(Boolean).join(" · "))}</p>`;
        el.onclick = () => open(a);
        bin.appendChild(el);
      });
    }
    function open(a) {
      document.getElementById("faces").innerHTML = [a.front, a.back, a.inner].filter(Boolean).map(s => `<img src="${esc(s)}" alt="">`).join("");
      document.getElementById("card").innerHTML = `<h2>${esc(a.title)}</h2><p>${esc(a.artist)}</p><p>${esc([a.year, a.label, a.catalog].filter(Boolean).join(" · "))}</p>
        <a class="listen sp" href="https://open.spotify.com/search/${qf(a)}" target="_blank" rel="noopener">Listen on Spotify</a>
        <a class="listen ap" href="https://music.apple.com/us/search?term=${qf(a)}" target="_blank" rel="noopener">Listen on Apple Music</a>`;
      stage.hidden = false; document.body.style.overflow = "hidden";
    }
    document.getElementById("close").onclick = () => { stage.hidden = true; document.body.style.overflow = ""; };
    q.addEventListener("input", draw);
    draw();
  </script>
</body>
</html>
